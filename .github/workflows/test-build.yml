name: DIVSTUDIO AI Final Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false

defaults:
  run:
    shell: bash

jobs:
  release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Verify Gradle
        run: gradle --version

      - name: Generate temporary release signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/release.keystore" \
            -storepass "divstudio-release" \
            -keypass "divstudio-release" \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=DIVSTUDIO AI, OU=DIVSTUDIO, O=DIVSTUDIO AI, L=Nigeria, ST=Lagos, C=NG"

      - name: Run unit tests
        run: gradle test --stacktrace

      - name: Build final release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: divstudio-release
          KEY_PASSWORD: divstudio-release
        run: gradle assembleRelease --stacktrace

      - name: Verify release APK
        run: |
          set -e
          ls -lh app/build/outputs/apk/release/*.apk
          test -s app/build/outputs/apk/release/*.apk
          echo "Final release APK verified."

      - name: Upload final release APK
        uses: actions/upload-artifact@v4
        with:
          name: divstudio-ai-final-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
