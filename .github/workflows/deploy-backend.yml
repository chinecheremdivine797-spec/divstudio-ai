name: Deploy DIVSTUDIO AI FFmpeg Backend

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy FFmpeg backend to Cloud Run
        run: |
          gcloud run deploy divstudio-ai-editor \
            --source backend \
            --region "${{ secrets.GCP_REGION }}" \
            --platform managed \
            --no-allow-unauthenticated \
            --set-env-vars "FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}" \
            --quiet

      - name: Show backend URL
        run: |
          gcloud run services describe divstudio-ai-editor \
            --region "${{ secrets.GCP_REGION }}" \
            --format='value(status.url)'
