name: Deploy DIVSTUDIO AI FFmpeg Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy FFmpeg + AI video backend to Cloud Run
        run: |
          gcloud run deploy divstudio-ai-editor \
            --source backend \
            --region "${{ secrets.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}" \
            --set-env-vars "RUNWAY_VIDEO_MODEL=${{ secrets.RUNWAY_VIDEO_MODEL || 'gen4.5' }}" \
            --set-env-vars "RUNWAY_ROUTER_CONFIG_ID=${{ secrets.RUNWAY_ROUTER_CONFIG_ID }}" \
            --set-env-vars "RUNWAYML_API_SECRET=${{ secrets.RUNWAYML_API_SECRET }}" \
            --quiet

      - name: Verify backend health
        run: |
          URL=$(gcloud run services describe divstudio-ai-editor \
            --region "${{ secrets.GCP_REGION }}" \
            --format='value(status.url)')
          echo "DIVSTUDIO_BACKEND_URL=$URL"
          curl --fail --silent --show-error "$URL/health"
