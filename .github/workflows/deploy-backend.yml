name: Deploy DIVSTUDIO AI FFmpeg Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

permissions:
  contents: read
  id-token: write

env:
  SERVICE_NAME: divstudio-ai-editor

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: latest

      - name: Configure project
        run: gcloud config set project "${{ secrets.GCP_PROJECT_ID }}"

      - name: Deploy complete DIVSTUDIO AI backend
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --source backend \
            --region "${{ secrets.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" \
            --set-env-vars "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            --set-env-vars "SUPABASE_STORAGE_BUCKET=${{ secrets.SUPABASE_STORAGE_BUCKET || 'divstudio-videos' }}" \
            --set-env-vars "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" \
            --set-env-vars "GOOGLE_VIDEO_MODEL=${{ secrets.GOOGLE_VIDEO_MODEL || 'veo-3.1-generate-preview' }}" \
            --set-env-vars "GOOGLE_VIDEO_RESOLUTION=${{ secrets.GOOGLE_VIDEO_RESOLUTION || '720p' }}" \
            --set-env-vars "RUNWAY_VIDEO_MODEL=${{ secrets.RUNWAY_VIDEO_MODEL || 'gen4.5' }}" \
            --set-env-vars "RUNWAY_ROUTER_CONFIG_ID=${{ secrets.RUNWAY_ROUTER_CONFIG_ID }}" \
            --set-env-vars "RUNWAYML_API_SECRET=${{ secrets.RUNWAYML_API_SECRET }}" \
            --set-env-vars "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" \
            --quiet

      - name: Verify complete backend health
        run: |
          URL=$(gcloud run services describe "$SERVICE_NAME" \
            --region "${{ secrets.GCP_REGION }}" \
            --format='value(status.url)')
          echo "DIVSTUDIO_BACKEND_URL=$URL"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$URL/health"
